[project]
name = "kira-hq"
version = "0.2.0"
description = "Command center for AI-driven projects (PRD v2.0)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
markers = [
    "smoke: fast smoke tests (target <1s total)",
    "integration: integration tests with realistic fixtures",
    "e2e: end-to-end browser tests (Playwright; deselected by default)",
]
# e2e is opt-in (requires Playwright browsers). Run explicitly:
#   pytest -m e2e   or   npx playwright test
# Default collection skips tests/e2e/ via --ignore=tests/e2e in the smoke/int
# runs below; tests marked @pytest.mark.e2e are also deselected here.
# Use `pytest -m e2e --no-cov` to run them after `npx playwright install chromium`.
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
pythonVersion = "3.11"
